<div class="registrations-container" id="registrations">
  <div class="registrations-content">
    <h3 class="registrations-title">REGISTRATIONS</h3>

    <div class="pricing-section">
      <div class="price-item">
        <span class="price-label">Early Bird:</span>
        <span class="price-value">USD 178</span>
      </div>
      <div class="price-item">
        <span class="price-label">Regular:</span>
        <span class="price-value">USD 196</span>
      </div>
    </div>

    <div class="description-section">
      <p class="description-text">
        You get access to all parties inc. 1 Gala Buffet Dinner & 1 Afternoon Tea Dance
      </p>
    </div>

    <div class="tshirt-section">
      <h2 class="tshirt-title">VLX 2026 T-shirt! Pre-order only!</h2>
      <p class="tshirt-description">
        But we may have some extra at 350,000VND/ T-shirt. Contact us for more details.
      </p>
    </div>

    <div class="register-button-section">
      <button class="register-button" (click)="onRegisterClick()">REGISTER HERE!!</button>
    </div>
  </div>
</div>
